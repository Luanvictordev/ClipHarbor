[package]
name = "clipharbor-desktop"
version = "0.1.0"
edition = "2021"
description = "Lightweight desktop downloader for ClipHarbor"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
id3 = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
